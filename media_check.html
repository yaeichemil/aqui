<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>aquí 영상 파일 확인 (임시 검사 페이지)</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:32px;font-family:Arial,'Malgun Gothic',sans-serif;background:#1c2029;color:#fff}h1{font-size:24px;margin:0 0 10px}p{line-height:1.6;color:#d5d9e1}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-top:22px}.card{border:1px solid #657082;border-radius:10px;padding:14px;background:#2d3440}.card h2{font-size:16px;margin:0 0 8px}.card small{font-size:12px;display:block;overflow-wrap:anywhere;color:#d3d8df;min-height:32px}.status{font-size:13px;min-height:52px;margin-top:8px;white-space:pre-line;color:#f8e3ad}.viewer{display:flex;justify-content:center;align-items:center;height:250px;margin:12px 0;border-radius:8px;overflow:hidden;background:conic-gradient(#d6d6d6 0 25%,#fff 0 50%,#d6d6d6 0 75%,#fff 0) 0 0/24px 24px}.viewer video{max-width:100%;max-height:100%;height:100%;width:100%;object-fit:contain}.good{color:#baf7d5}.bad{color:#ffaaa3}code{font-family:Consolas,monospace}
</style>
</head>
<body>
<h1>영상 파일 단독 재생 검사</h1>
<p>이 페이지는 사이트 화면·인터랙션을 건드리지 않고 파일 로딩/코덱/투명도만 확인하는 용도야. <strong>프로젝트 루트(index.html 옆)</strong>에 놓고 Live Server로 <code>/media_check.html</code>을 열어줘. 각 영상의 재생 버튼을 눌러 보고 상태를 확인해줘. 검사 후에는 이 파일을 삭제해도 돼.</p>
<div class="grid" id="grid"></div>
<script>
const entries=[
  ['06 HOME','./assets/06_before-service/2_main/before-service_main_prototype.webm'],
  ['06 CARE LOG','./assets/06_before-service/3_care_log/before-service_carelog_prototype.webm'],
  ['06 ARCHIVE','./assets/06_before-service/4_archive/before-service_archive_prototype.webm'],
  ['07 BRIDGE','./assets/07_bridge/temp/bridge_media_v02_temp.mp4'],
  ['08 AFTER LOSS HOME','./assets/08_after-service/2_after_loss_home/after-service_home_left.webm'],
  ['08 EPILOGUE 01','./assets/08_after-service/3_epilogue/prototype_01_check/after_service_epilogue_check.webm'],
  ['08 EPILOGUE 02','./assets/08_after-service/3_epilogue/prototype_02_pet_funeral_services/after_service_epilogue_pet_funeral_services.webm'],
  ['08 EPILOGUE 03','./assets/08_after-service/3_epilogue/prototype_03_community/after-service_epilogue_community.webm'],
  ['08 EPILOGUE 04','./assets/08_after-service/3_epilogue/prototype_04_pet_loss_counseling/after-service_epilogue_pet%20loss%20counseling.webm']
];
const errorCodes={1:'재생 중단',2:'네트워크/파일 로딩 문제',3:'디코딩 실패',4:'파일 형식·코덱 미지원 또는 경로 오류'};
const grid=document.getElementById('grid');
entries.forEach(([name,src])=>{
 const card=document.createElement('article');card.className='card';
 const heading=document.createElement('h2');heading.textContent=name;
 const path=document.createElement('small');path.textContent=src;
 const box=document.createElement('div');box.className='viewer';
 const video=document.createElement('video');video.controls=true;video.muted=true;video.playsInline=true;video.preload='metadata';video.src=src;
 const status=document.createElement('div');status.className='status';status.textContent='불러오는 중…';
 const set=(s,good=false)=>{status.textContent=s;status.className='status '+(good?'good':'bad')};
 video.addEventListener('loadedmetadata',()=>set(`메타데이터 로드 ✔ | ${video.videoWidth}×${video.videoHeight}, ${video.duration.toFixed(1)}초\n재생 ▶ 눌러 확인`,true));
 video.addEventListener('playing',()=>set(`재생 중 ✔ ${video.videoWidth}×${video.videoHeight}\n화면이 비어 보이면 투명도/영상 내용 확인`,true));
 video.addEventListener('ended',()=>set('정상 종료 ✔ (마지막 프레임 유지)',true));
 video.addEventListener('error',()=>set(`오류 ${video.error?.code??'?'}: ${errorCodes[video.error?.code]||'알 수 없음'}\n${video.error?.message||'파일 경로/코덱을 확인'}`));
 video.addEventListener('stalled',()=>{if(!video.error) status.textContent='데이터 로딩 지연…';});
 box.appendChild(video);card.append(heading,path,box,status);grid.appendChild(card);
});
</script>
</body>
</html>
